<!-- KILL OLD SERVICE WORKERS + CACHES — runs before anything else -->
<script>
(function() {
  'use strict';
  var APP_VERSION = '20250426j'; // revert forgotPassword — restore email sending

  // 1. Wipe ALL browser caches immediately
  if (window.caches) {
    caches.keys().then(function(names) {
      names.forEach(function(n) { caches.delete(n); });
    });
  }

  // 2. Unregister every old SW that doesn't match our version
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(reg) {
        // Check if this registration is for our current version
        var scriptURL = reg.active && reg.active.scriptURL || '';
        if (scriptURL.indexOf(APP_VERSION) === -1) {
          console.log('[App] Unregistering old SW:', scriptURL);
          reg.unregister();
        }
      });
    });

    // 3. Listen for SW messages
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SW_UPDATED') {
        console.log('[App] SW updated to', e.data.version);
      }
    });
  }
})();
</script>

<!-- Register fresh SW + boot app -->
<script>
(function() {
  if ('serviceWorker' in navigator) {
    // Force SW update check on every page load
    navigator.serviceWorker.register('sw.js?v=20250426j')
      .then(function(reg) {
        console.log('[SW] Ready:', reg.scope);
        // Immediately activate any waiting SW
        if (reg.waiting) { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
        reg.addEventListener('updatefound', function() {
          const nw = reg.installing;
          if (nw) {
            nw.addEventListener('statechange', function() {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // New SW installed — reload to get fresh files
                window.location.reload();
              }
            });
          }
        });
      })
      .catch(function(e) { console.warn('[SW] Failed:', e); });

    // Also reload if the SW controller changes (another tab activated new SW)
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      window.location.reload();
    });
  }
})();
</script>
